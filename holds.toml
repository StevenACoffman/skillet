# Deferred decisions and the conditions that would end them.
#
# Read by `bin/triggers.sh`, which runs `invigilator check` over consumer checkouts.
# This file exists because four criteria in TODO.md fired without anyone noticing:
# provenance's deletion condition, auditlog's promotion condition resolving negatively,
# quotecheck's not-applicable outcome shipping, and an OKF trigger that turned out to be
# unfireable by construction. Three of the four were mechanical. None had an observer.
#
# `kind` is required. A condition nobody can evaluate is legitimate — plenty are a
# person's call — but it must say so and stay listed, because from the outside an
# unfireable condition looks exactly like one that has not fired yet. That was the
# OKF failure, and it is the one a report that only counts would miss.
#
# The argument for each hold lives in TODO.md. `condition` here is for the reader and
# is never parsed; `where` is a locator, deliberately weak.
#
# Only deferred decisions belong here. An invariant — something that must stay true,
# like "no package marked provisional has an importer" — is a different thing, and
# modelling one as a hold makes `met` mean both "act now" and "all is well". That
# check wants CI, not this file.

# **An item in TODO.md tagged `{await-trigger}` or `{blocked-external}` wants a hold
# here.** Those two tags mark an item whose condition is external to the item itself,
# which is the same thing this file records — and a tagged item with no hold is a
# condition with no observer, the failure the four criteria above are the record of. The
# other tags do not: `{blocked}` names a dependency on another backlog item, `{cross-repo}`
# names who does the work, and `{decision-needed}` has nothing that can fire, so a hold for
# one would be the never-firing kind this file warns about.
#
# Nothing checks the correspondence mechanically, deliberately. Reading it would mean
# knowing which TODO.md sits where relative to the roots — the machine-specific fact the
# no-default-roots decision refuses to encode — and parsing a checkbox line, which is the
# same prose-matching `condition` is exempt from. It is a rule for whoever adds a tag.

[[hold]]
id        = "bandit"
kind      = "count"
condition = "a 2nd consumer wants principled strategy selection under uncertainty"
where     = "TODO.md — Deferred: a possible skillet/bandit"
  [hold.count]
  pattern   = "skillet/bandit"
  include   = "*.go"
  exclude   = "*_test.go"
  threshold = 2
  compare   = "at-least"

[[hold]]
id        = "set-hash"
kind      = "count"
condition = "a 2nd consumer needs to fingerprint a collection rather than one artifact"
where     = "TODO.md — A set hash beside identity.Hash"
  [hold.count]
  pattern   = "identity.SetHash"
  include   = "*.go"
  exclude   = "*_test.go"
  threshold = 2
  compare   = "at-least"

[[hold]]
id        = "skip-record"
kind      = "count"
condition = "a 2nd consumer emits a check report carrying skipped checks; gnosis is the first"
where     = "TODO.md — the Skip{Check, Reason} trigger, under the applicability decision"
  [hold.count]
  pattern   = "Skipped []Skip"
  include   = "*.go"
  exclude   = "*_test.go"
  threshold = 2
  compare   = "at-least"

[[hold]]
id        = "okf-fold"
kind      = "manual"
condition = "the 2nd repo that derives a trust tier from an actor list, not the 2nd that spells a tier name"
where     = "TODO.md — OKF's trust fields, replacement trigger"
# Was kind = "count" on pattern = "machine-confirmed", threshold 2. It reported met on
# 2026-08-23 against a condition its own entry says has not fired, in two ways worth keeping:
#
#   1. A tier name is not a fold. Both matches were real code and neither derived anything:
#      adh stores the answer in a TrustTier string, and gnosis's FoldTrust was an untracked
#      file. Counting the vocabulary cannot detect use of the mechanism, and here the two
#      diverge precisely because one repo has the words without the fold.
#   2. The scan reads the working tree, so untracked work counts toward a threshold. That may
#      be the right default for invigilator — a consumer mid-flight is still demand — but it
#      means a hold can fire on a file that is in no commit.
#
# No pattern replaces it. "Derives a tier from an actor list" is a claim about what a function
# does, and matching it needs the type-aware query invigilator's own TODO declines to build.
# Manual, per this file's header: a condition nobody can evaluate is legitimate if it says so.

[[hold]]
id        = "subject-slot"
kind      = "manual"
condition = "a ruleset whose rules constrain named quantities to intervals or enumerations"
where     = "TODO.md — DEFERRED 2026-08-15: the canonical form has no subject slot"

[[hold]]
id        = "span-offsets"
kind      = "manual"
condition = "a consumer that wants to SHOW a failure branch rather than count one"
where     = "TODO.md — A blanked code span leaves unreadable evidence text"

[[hold]]
id        = "rewrite-kind"
kind      = "manual"
condition = "a 2nd caller that must act on a specific rewrite; only one of seven admits a distinct action"
where     = "TODO.md — testprompts.File.Rewrites can be printed but not classified"

# Retired 2026-09-06: adjudication-artifact. Its condition was "blocked on the ruleset
# format version", and all of it shipped — the version reader is format 1, the ⚖ warrant
# marker is format 2, and `ruleset.Rule.Warrant{By, At, Rationale}` is in v0.29.0 onward,
# which is the shape the held entry specified down to "and nothing else".
#
# **It reported `manual` on every run for ten days after it was satisfied**, which from the
# outside is indistinguishable from a condition that has not fired — the fifth instance of
# the failure this file's header exists to record. A contributing cause worth naming: its
# `where` pointed at the held entry, while the resolution was written into a later section
# 1100 lines down, so a reader following the locator never saw it was answered.

[[hold]]
id        = "warrant-cited-unbuilt"
kind      = "count"
condition = "gnosis_warrant is built; this repository and canonizer cite the section that specifies it"
where     = "gnosis SPEC.md §10.6.4 — load-bearing outside gnosis before any of it is built"
# Inverted on purpose: met means the citation risk is over, not that work is due.
#
# §10.6.4 records that a grep for gnosis_warrant returns nothing while two repositories
# point at the section as the family's model of adjudication authority. The risk it names
# is that a reshaping done for local convenience breaks something not in that repository
# to notice -- and an unbuilt cited section looks identical to a built one from outside.
#
# Threshold 1, not 2: this is not a promotion trigger. It asks whether the thing exists.
  [hold.count]
  pattern   = "gnosis_warrant"
  include   = "*.go"
  exclude   = "*_test.go"
  threshold = 1
  compare   = "at-least"

[[hold]]
id        = "verdict-act"
kind      = "manual"
condition = "a tool in the family performs semantic replay, so the field could read performed"
where     = "TODO.md — manifest.Manifest has no field saying which act produced the verdict"
# Not a count, and not for want of a pattern. Today the field would be a constant:
# exegesis is the structural half by charter and never replays, so "which act produced this"
# has one possible answer and a one-valued field on a kernel type is how `provenance` came
# to be carried with zero importers until v0.20.0 deleted it. What makes the field carry
# information is a *replayer or grader existing*, which is a claim about what a tool does
# rather than a string any of them contains — the okf-fold lesson, one hold up.

[[hold]]
id        = "inert-render-corpus"
kind      = "manual"
condition = "a stored ruleset in the canonical form exists anywhere, so the byte-identical claim can be checked on a corpus"
where     = "TODO.md — The inert-render property is proven on a fixture, not on the corpus"
# A count was considered and refused twice over. The canonical rule header is
# "§<section>  [SEVERITY][LEVEL]  statement", and `pattern` is a plain string, so the only
# greppable part is the section sign. Re-measured 2026-09-06 against format 3 (v0.30.0,
# which every consumer now pins): **93 candidate files, 23 returning no error from
# ruleset.Parse, and 0 of those carrying a single rule.** The 23 are prose documents —
# PLAN.md, SPEC.md, this repo's own TODO.md — that Parse tolerates as a degenerate empty
# format-1 ruleset.
#
# **So a count would report met at 23 while the honest answer is 0**, which is okf-fold's
# false-met exactly. The condition is "parses as the form *and carries a rule*", which is a
# parser's answer and not a pattern's. Only the candidate count moved, from 66; what it
# measures did not.
